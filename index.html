<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveFlix</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --red: #E50914;
      --text: #FFFFFF;
      --muted: #AAAAAA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
      z-index: 10;
    }

    .logo {
      color: var(--red);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
    }

    main { padding: 100px 4% 60px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 4px;
      aspect-ratio: 2 / 3;
      display: flex;
      align-items: flex-end;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.33, 1, 0.68, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
      word-break: break-word;
    }

    .status {
      color: var(--muted);
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-box {
      width: 90%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    video { width: 100%; height: 100%; outline: none; }

    .close {
      position: absolute;
      top: -40px; right: 0;
      font-size: 2rem;
      color: var(--text);
      cursor: pointer;
      opacity: 0.8;
    }

    .close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DRIVEFLIX</div>
  </header>

  <main>
    <div class="grid" id="grid">
      <div class="status">Loading titles...</div>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <span class="close" onclick="closePlayer()">&times;</span>
      <video id="player" controls autoplay></video>
    </div>
  </div>

  <script>
    // Replace these two strings with your values
    const API_KEY = "AIzaSyD1lUnWikkKMZ2TSs6WIeQDtTSladOFBhs";
    const FOLDER_ID = "17obTR3RAAeF4nLTNWpIKb_bpxfQCUvRc";

    async function loadDriveFlix() {
      const grid = document.getElementById('grid');
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.files || data.files.length === 0) {
          grid.innerHTML = `<div class="status">No files found in folder.</div>`;
          return;
        }

        grid.innerHTML = "";
        data.files.forEach(file => {
          if (file.mimeType !== 'application/vnd.google-apps.folder') {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => playVideo(file.id);

            const title = file.name.replace(/\.[^/.]+$/, "");
            card.innerHTML = `<div class="title">${title}</div>`;
            grid.appendChild(card);
          }
        });
      } catch (e) {
        grid.innerHTML = `<div class="status">Failed to load media. Check API Key and folder sharing settings.</div>`;
      }
    }

    function playVideo(id) {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      player.src = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${API_KEY}`;
      modal.classList.add('active');
    }

    function closePlayer() {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      player.pause();
      player.src = "";
      modal.classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePlayer();
    });

    loadDriveFlix();
  </script>
</body>
</html>
