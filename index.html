<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveFlix</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --red: #E50914;
      --text: #FFFFFF;
      --muted: #AAAAAA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Header & Search Bar */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      z-index: 10;
    }

    .logo {
      color: var(--red);
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      user-select: none;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
      width: 220px;
      transition: width 0.3s ease, border-color 0.3s ease;
    }

    .search-input:focus {
      width: 300px;
      border-color: #fff;
      background: rgba(0, 0, 0, 0.9);
    }

    main { padding: 100px 4% 60px; }

    /* Grid & Poster Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 4px;
      aspect-ratio: 2 / 3;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.33, 1, 0.68, 1);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      z-index: 2;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #2a2a2a;
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
      display: flex;
      align-items: flex-end;
      padding: 14px;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.2;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .status {
      color: var(--muted);
      grid-column: 1 / -1;
      padding: 40px 0;
    }

    /* Video Player Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.active { display: flex; }

    .modal-box {
      width: 90%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    video { width: 100%; height: 100%; outline: none; }

    .close {
      position: absolute;
      top: -40px; right: 0;
      font-size: 2rem;
      color: var(--text);
      cursor: pointer;
      opacity: 0.8;
    }

    .close:hover { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div class="logo">DRIVEFLIX</div>
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search titles..." oninput="handleSearch()" />
    </div>
  </header>

  <main>
    <div class="grid" id="grid">
      <div class="status">Loading titles...</div>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-box">
      <span class="close" onclick="closePlayer()">&times;</span>
      <video id="player" controls autoplay></video>
    </div>
  </div>

  <script>
    const API_KEY = "YOUR_GOOGLE_DRIVE_API_KEY";
    const FOLDER_ID = "YOUR_GOOGLE_DRIVE_FOLDER_ID";

    let moviesStore = [];

    // Clean filenames (e.g., "Inception.2010.1080p.WEBRip.x264.mp4" -> "Inception 2010")
    function cleanTitle(rawName) {
      let name = rawName.replace(/\.[^/.]+$/, ""); // Strip file extension
      name = name.replace(/[\._]/g, " ");          // Replace dots & underscores with spaces
      // Remove common release/quality tags
      name = name.replace(/\b(1080p|720p|4k|2160p|hdr|web-?dl|webrip|hdrip|bluray|x264|x265|hevc|aac|yts|rarbg)\b/gi, "");
      name = name.replace(/\[.*?\]|\(.*?\)/g, ""); // Strip bracketed tags
      return name.trim();
    }

    // Fetch poster artwork asynchronously from iTunes API (No API key required)
    async function fetchPoster(title) {
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(title)}&entity=movie&limit=1`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          // Replace thumbnail dimensions with 600x600 for crisp high-res poster
          return data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
        }
      } catch (e) {
        console.warn("Poster search skipped for:", title);
      }
      return null;
    }

    async function loadDriveFlix() {
      const grid = document.getElementById('grid');
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.files || data.files.length === 0) {
          grid.innerHTML = `<div class="status">No files found in folder.</div>`;
          return;
        }

        // Store clean titles and file metadata
        moviesStore = data.files
          .filter(file => file.mimeType !== 'application/vnd.google-apps.folder')
          .map(file => ({
            id: file.id,
            rawName: file.name,
            cleanTitle: cleanTitle(file.name),
            posterUrl: null
          }));

        renderGrid(moviesStore);
        loadPostersInBackground();
      } catch (e) {
        grid.innerHTML = `<div class="status">Failed to load media. Check API Key and folder sharing settings.</div>`;
      }
    }

    function renderGrid(movies) {
      const grid = document.getElementById('grid');
      if (movies.length === 0) {
        grid.innerHTML = `<div class="status">No matching titles found.</div>`;
        return;
      }

      grid.innerHTML = "";
      movies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => playVideo(movie.id);

        const imgTag = movie.posterUrl 
          ? `<img class="poster-img" src="${movie.posterUrl}" alt="${movie.cleanTitle}" />`
          : `<div class="poster-img"></div>`;

        card.innerHTML = `
          ${imgTag}
          <div class="card-overlay">
            <div class="card-title">${movie.cleanTitle}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Scrape thumbnails in the background without blocking render
    async function loadPostersInBackground() {
      for (let movie of moviesStore) {
        const poster = await fetchPoster(movie.cleanTitle);
        if (poster) {
          movie.posterUrl = poster;
          // Refresh active view if searching or displaying grid
          const searchVal = document.getElementById('search-input').value.toLowerCase();
          if (!searchVal || movie.cleanTitle.toLowerCase().includes(searchVal)) {
            renderGrid(moviesStore.filter(m => m.cleanTitle.toLowerCase().includes(searchVal)));
          }
        }
      }
    }

    // Real-time Search Filter
    function handleSearch() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const filtered = moviesStore.filter(movie => 
        movie.cleanTitle.toLowerCase().includes(searchTerm) ||
        movie.rawName.toLowerCase().includes(searchTerm)
      );
      renderGrid(filtered);
    }

    function playVideo(id) {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      player.src = `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${API_KEY}`;
      modal.classList.add('active');
    }

    function closePlayer() {
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      player.pause();
      player.src = "";
      modal.classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePlayer();
    });

    loadDriveFlix();
  </script>
</body>
</html>
