<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveFlix</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --red: #E50914;
      --text: #FFFFFF;
      --muted: #AAAAAA;
      --accent: #46d369;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      min-height: 68px;
      padding: 10px 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
      z-index: 20;
    }

    .nav-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .logo { color: var(--red); font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; user-select: none; }
    .nav-tabs { display: flex; gap: 16px; list-style: none; }
    .nav-tab { color: #e5e5e5; font-size: 0.85rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; }
    .nav-tab:hover, .nav-tab.active { opacity: 1; font-weight: 600; }

    .search-input {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.85rem;
      outline: none;
      width: 180px;
      transition: width 0.3s ease;
    }
    .search-input:focus { width: 240px; border-color: #fff; background: rgba(0, 0, 0, 0.95); }

    .hero {
      position: relative;
      height: 60vh;
      min-height: 350px;
      background-size: cover;
      background-position: center 20%;
      display: flex;
      align-items: flex-end;
      padding: 0 4% 40px;
    }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(20,20,20,0.3) 0%, rgba(20,20,20,0.8) 70%, #141414 100%),
                  linear-gradient(90deg, rgba(20,20,20,0.9) 0%, rgba(20,20,20,0.4) 50%, transparent 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 600px; }
    .hero-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; line-height: 1.1; }
    .hero-plot {
      font-size: 0.9rem; color: #d2d2d2; line-height: 1.4; margin-bottom: 16px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hero-btn {
      display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #000;
      font-weight: 700; font-size: 0.95rem; padding: 10px 20px; border-radius: 4px; border: none; cursor: pointer;
    }

    main { padding: 0 4% 60px; }
    .category-section { margin-bottom: 30px; }
    .category-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; color: #e5e5e5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .card {
      background: var(--card-bg); border-radius: 4px; aspect-ratio: 2 / 3; position: relative;
      overflow: hidden; cursor: pointer; transition: transform 0.25s ease; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .card:hover { transform: scale(1.04); box-shadow: 0 10px 20px rgba(0,0,0,0.8); z-index: 2; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; display: block; background: #2a2a2a; }
    .card-info {
      position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    }
    .card-title { font-size: 0.85rem; font-weight: 700; line-height: 1.2; }
    .card-year { font-size: 0.7rem; color: var(--muted); margin-top: 3px; }
    .status { color: var(--muted); padding: 40px 0; }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 100; align-items: center; justify-content: center; padding: 15px;
    }
    .modal-overlay.active { display: flex; }
    .detail-card {
      background: #181818; width: 100%; max-width: 800px; border-radius: 8px;
      overflow: hidden; position: relative; display: flex; flex-direction: column; max-height: 90vh;
    }
    .close-btn { position: absolute; top: 12px; right: 16px; font-size: 1.8rem; color: #fff; cursor: pointer; z-index: 10; }
    .detail-hero { display: flex; gap: 20px; padding: 24px; background: linear-gradient(180deg, rgba(24,24,24,0.4) 0%, #181818 100%); overflow-y: auto; }
    .detail-poster { width: 180px; border-radius: 6px; aspect-ratio: 2/3; object-fit: cover; flex-shrink: 0; }
    .detail-body { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .detail-title { font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
    .detail-meta { display: flex; gap: 10px; font-size: 0.85rem; color: var(--muted); align-items: center; }
    .badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; color: #fff; font-size: 0.75rem; }
    .ratings { display: flex; gap: 14px; font-size: 0.85rem; }
    .rating-score { color: var(--accent); font-weight: 700; }
    .action-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: #fff; color: #000; font-weight: 700; padding: 10px 18px; border-radius: 4px; border: none; cursor: pointer; width: fit-content;
    }
    .synopsis { font-size: 0.9rem; line-height: 1.4; color: #d2d2d2; }
    .credits { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
    .credits span { color: #fff; }

    .player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 200; }
    .player-overlay.active { display: block; }
    .player-close {
      position: absolute; top: 15px; left: 15px; font-size: 1rem; color: #fff;
      cursor: pointer; z-index: 201; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 4px;
    }
    video { width: 100%; height: 100%; outline: none; }

    @media (max-width: 768px) {
      header { padding: 10px 4%; }
      .nav-left { width: 100%; justify-content: space-between; }
      .search-input { width: 100%; }
      .search-input:focus { width: 100%; }
      .hero { height: 50vh; padding-bottom: 30px; }
      .hero-title { font-size: 1.6rem; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .detail-hero { flex-direction: column; align-items: center; text-align: center; padding: 20px 16px; }
      .detail-poster { width: 140px; margin-bottom: 10px; }
      .detail-meta, .ratings { justify-content: center; }
      .action-btn { margin: 0 auto; width: 100%; }
      .credits { text-align: left; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-left">
      <div class="logo">DRIVEFLIX</div>
      <ul class="nav-tabs">
        <li class="nav-tab active" onclick="filterType('all', this)">Home</li>
        <li class="nav-tab" onclick="filterType('movie', this)">Movies</li>
        <li class="nav-tab" onclick="filterType('series', this)">TV Series</li>
      </ul>
    </div>
    <input type="text" id="search-input" class="search-input" placeholder="Search titles..." oninput="handleSearch()" />
  </header>

  <div class="hero" id="hero-banner">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">Loading...</h1>
      <p class="hero-plot" id="hero-plot"></p>
      <button class="hero-btn" id="hero-play-btn" style="display:none;">▶ Play</button>
    </div>
  </div>

  <main id="main-content">
    <div id="categories-container">
      <div class="status">Loading library...</div>
    </div>
  </main>

  <div class="modal-overlay" id="detail-modal">
    <div class="detail-card">
      <span class="close-btn" onclick="closeDetailModal()">&times;</span>
      <div class="detail-hero">
        <img id="modal-poster" class="detail-poster" src="" alt="Poster" />
        <div class="detail-body">
          <div id="modal-title" class="detail-title">Title</div>
          <div class="detail-meta">
            <span id="modal-year">2025</span>
            <span id="modal-rated" class="badge">PG-13</span>
            <span id="modal-runtime">120 min</span>
          </div>
          <div class="ratings">
            <div>IMDb: <span id="modal-imdb" class="rating-score">N/A</span></div>
            <div>Rotten Tomatoes: <span id="modal-rt" class="rating-score">N/A</span></div>
          </div>
          <button id="modal-play-btn" class="action-btn">▶ Play</button>
          <div id="modal-plot" class="synopsis">Movie plot outline...</div>
          <div class="credits">
            <div>Director: <span id="modal-director">N/A</span></div>
            <div>Starring: <span id="modal-cast">N/A</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="player-overlay" id="player-modal"></div>

  <script>
    const API_KEY = "YOUR_GOOGLE_DRIVE_API_KEY";
    const FOLDER_ID = "YOUR_GOOGLE_DRIVE_FOLDER_ID";
    const OMDB_API_KEY = "trilogy";

    const MANUAL_OVERRIDES = {
      "I Swear": { searchTitle: "I Swear", year: "2024" },
      "A.Big.Bold": { searchTitle: "A Big Bold Beautiful Journey", year: "2025" }
    };

    let moviesStore = [];
    let currentFilterType = "all";
    let currentActiveMovie = null;

    function parseFilename(rawName) {
      for (const [key, override] of Object.entries(MANUAL_OVERRIDES)) {
        if (rawName.includes(key)) return override;
      }
      let clean = rawName.replace(/\.[^/.]+$/, "");
      const yearMatch = clean.match(/\b(19\d\d|20\d\d)\b/);
      let year = yearMatch ? yearMatch[0] : "";

      if (yearMatch) {
        clean = clean.substring(0, yearMatch.index);
      } else {
        clean = clean.replace(/\b(1080p|720p|4k|2160p|hdr|web-?dl|webrip|hdrip|bluray|x264|x265|hevc|aac|yts|rarbg)\b/gi, "");
      }

      clean = clean.replace(/[\._]/g, " ").replace(/\[.*?\]|\(.*?\)/g, "").trim();
      return { searchTitle: clean, year: year };
    }

    async function fetchOMDbMetadata(searchTitle, year) {
      try {
        const query = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(searchTitle)}&y=${year}`;
        const res = await fetch(query);
        const data = await res.json();
        if (data.Response === "True") {
          const rtRating = data.Ratings ? data.Ratings.find(r => r.Source === "Rotten Tomatoes") : null;
          return {
            title: data.Title,
            year: data.Year,
            type: data.Type,
            genre: data.Genre ? data.Genre.split(', ') : ['Uncategorized'],
            poster: data.Poster !== "N/A" ? data.Poster : null,
            plot: data.Plot,
            director: data.Director,
            cast: data.Actors,
            rated: data.Rated,
            runtime: data.Runtime,
            imdb: data.imdbRating,
            rt: rtRating ? rtRating.Value : "N/A"
          };
        }
      } catch (e) { console.warn("OMDb fetch failed:", searchTitle); }
      return null;
    }

    async function loadDriveFlix() {
      const container = document.getElementById('categories-container');
      const rootUrl = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;

      try {
        const res = await fetch(rootUrl);
        const data = await res.json();

        if (!data.files || data.files.length === 0) {
          container.innerHTML = `<div class="status">No items found in folder.</div>`;
          return;
        }

        const moviesList = [];

        for (const item of data.files) {
          if (item.mimeType === 'application/vnd.google-apps.folder') {
            const subUrl = `https://www.googleapis.com/drive/v3/files?q='${item.id}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;
            const subRes = await fetch(subUrl);
            const subData = await subRes.json();

            let videoFile = null;

            if (subData.files) {
              subData.files.forEach(f => {
                if (f.mimeType.startsWith('video/') || f.name.match(/\.(mp4|mkv|webm|avi|mov)$/i)) {
                  videoFile = f;
                }
              });
            }

            if (videoFile) {
              const parsed = parseFilename(item.name !== "" ? item.name : videoFile.name);
              moviesList.push({
                id: videoFile.id,
                rawName: item.name,
                searchTitle: parsed.searchTitle,
                year: parsed.year,
                meta: null
              });
            }
          } else if (item.mimeType.startsWith('video/') || item.name.match(/\.(mp4|mkv|webm|avi|mov)$/i)) {
            const parsed = parseFilename(item.name);
            moviesList.push({
              id: item.id,
              rawName: item.name,
              searchTitle: parsed.searchTitle,
              year: parsed.year,
              meta: null
            });
          }
        }

        moviesStore = moviesList;
        renderCategories();
        loadMetadataInBackground();
      } catch (e) {
        container.innerHTML = `<div class="status">Failed to load media library.</div>`;
      }
    }

    function renderCategories() {
      const container = document.getElementById('categories-container');
      const searchVal = document.getElementById('search-input').value.toLowerCase();

      let filtered = moviesStore.filter(m => {
        if (currentFilterType === 'movie') return m.meta ? m.meta.type === 'movie' : true;
        if (currentFilterType === 'series') return m.meta ? m.meta.type === 'series' : false;
        return true;
      });

      if (searchVal) {
        filtered = filtered.filter(m => 
          m.searchTitle.toLowerCase().includes(searchVal) ||
          (m.meta && m.meta.title.toLowerCase().includes(searchVal))
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status">No titles found.</div>`;
        return;
      }

      const genreGroups = {};
      filtered.forEach(m => {
        const genres = (m.meta && m.meta.genre) ? m.meta.genre : ['Library'];
        genres.forEach(g => {
          if (!genreGroups[g]) genreGroups[g] = [];
          genreGroups[g].push(m);
        });
      });

      container.innerHTML = "";

      for (const [genre, items] of Object.entries(genreGroups)) {
        const sec = document.createElement('div');
        sec.className = 'category-section';

        const title = document.createElement('h2');
        title.className = 'category-title';
        title.innerText = genre;
        sec.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        items.forEach(movie => {
          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openDetailModal(movie);

          const displayTitle = movie.meta ? movie.meta.title : movie.searchTitle;
          const displayYear = movie.meta ? movie.meta.year : movie.year;
          const posterSrc = movie.meta && movie.meta.poster ? movie.meta.poster : '';

          const imgTag = posterSrc 
            ? `<img class="poster-img" src="${posterSrc}" alt="${displayTitle}" />`
            : `<div class="poster-img"></div>`;

          card.innerHTML = `
            ${imgTag}
            <div class="card-info">
              <div class="card-title">${displayTitle}</div>
              <div class="card-year">${displayYear}</div>
            </div>
          `;
          grid.appendChild(card);
        });

        sec.appendChild(grid);
        container.appendChild(sec);
      }
    }

    async function loadMetadataInBackground() {
      for (let movie of moviesStore) {
        const meta = await fetchOMDbMetadata(movie.searchTitle, movie.year);
        if (meta) {
          movie.meta = meta;
          renderCategories();
        }
      }
      setupHeroShuffle();
    }

    function setupHeroShuffle() {
      if (moviesStore.length === 0) return;
      const randomMovie = moviesStore[Math.floor(Math.random() * moviesStore.length)];
      const meta = randomMovie.meta || {};

      document.getElementById('hero-title').innerText = meta.title || randomMovie.searchTitle;
      document.getElementById('hero-plot').innerText = meta.plot || "Select title to view details and stream instantly.";

      const playBtn = document.getElementById('hero-play-btn');
      playBtn.style.display = 'inline-flex';
      playBtn.onclick = () => openDetailModal(randomMovie);

      if (meta.poster) {
        document.getElementById('hero-banner').style.backgroundImage = `url('${meta.poster}')`;
      }
    }

    function filterType(type, element) {
      currentFilterType = type;
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      renderCategories();
    }

    function handleSearch() { renderCategories(); }

    function openDetailModal(movie) {
      currentActiveMovie = movie;
      const meta = movie.meta || {};

      document.getElementById('modal-title').innerText = meta.title || movie.searchTitle;
      document.getElementById('modal-year').innerText = meta.year || movie.year || "N/A";
      document.getElementById('modal-rated').innerText = meta.rated || "NR";
      document.getElementById('modal-runtime').innerText = meta.runtime || "";
      document.getElementById('modal-imdb').innerText = meta.imdb || "N/A";
      document.getElementById('modal-rt').innerText = meta.rt || "N/A";
      document.getElementById('modal-plot').innerText = meta.plot || "No synopsis available.";
      document.getElementById('modal-director').innerText = meta.director || "N/A";
      document.getElementById('modal-cast').innerText = meta.cast || "N/A";

      const posterElem = document.getElementById('modal-poster');
      if (meta.poster) {
        posterElem.src = meta.poster;
        posterElem.style.display = 'block';
      } else {
        posterElem.style.display = 'none';
      }

      // Check device local storage for saved timestamp
      const savedTime = localStorage.getItem(`playback_pos_${movie.id}`);
      const playBtn = document.getElementById('modal-play-btn');

      if (savedTime && parseFloat(savedTime) > 5) {
        const mins = Math.floor(parseFloat(savedTime) / 60);
        playBtn.innerText = `▶ Resume Play (${mins}m)`;
      } else {
        playBtn.innerText = `▶ Play`;
      }

      playBtn.onclick = () => playMovie(movie, savedTime ? parseFloat(savedTime) : 0);
      document.getElementById('detail-modal').classList.add('active');
    }

    function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }

    function playMovie(movie, startTime) {
      closeDetailModal();
      const playerModal = document.getElementById('player-modal');
      
      const proxyStreamUrl = `https://corsproxy.io/?${encodeURIComponent('https://www.googleapis.com/drive/v3/files/' + movie.id + '?alt=media&key=' + API_KEY)}`;
      
      playerModal.innerHTML = `
        <span class="player-close" onclick="closePlayer()">✕ Back</span>
        <video id="active-video-player" controls autoplay style="width:100%; height:100%;">
          <source src="${proxyStreamUrl}" type="video/mp4">
          <source src="https://www.googleapis.com/drive/v3/files/${movie.id}?alt=media&key=${API_KEY}" type="video/mp4">
        </video>
      `;
      playerModal.classList.add('active');

      const videoPlayer = document.getElementById('active-video-player');

      // Seek to saved resume position once video metadata loads
      videoPlayer.onloadedmetadata = () => {
        if (startTime > 0) {
          videoPlayer.currentTime = startTime;
        }
      };

      // Save watch progress to LocalStorage periodically
      videoPlayer.ontimeupdate = () => {
        if (videoPlayer.currentTime > 5) {
          localStorage.setItem(`playback_pos_${movie.id}`, videoPlayer.currentTime);
        }
      };
    }

    function closePlayer() {
      const playerModal = document.getElementById('player-modal');
      const videoPlayer = document.getElementById('active-video-player');

      if (currentActiveMovie && videoPlayer && videoPlayer.currentTime > 5) {
        localStorage.setItem(`playback_pos_${currentActiveMovie.id}`, videoPlayer.currentTime);
      }

      playerModal.innerHTML = "";
      playerModal.classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDetailModal();
        closePlayer();
      }
    });

    loadDriveFlix();
  </script>
</body>
</html>
